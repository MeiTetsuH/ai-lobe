# Fork override: upstream ships no lockfile, which lets warm build caches keep
# stale peer-satisfying versions and break Vercel builds. We commit one instead.
lockfile: true
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

packages:
  - packages/**
  - .
  - e2e
  - apps/desktop/src/main
  - apps/auth
  - apps/server
  - apps/share
  - apps/workbench

minimumReleaseAgeExclude:
  - '@lobehub/*'

# Build scripts run one at a time. Several peer-variant copies of
# @lobehub/editor resolve in this workspace and every copy's postinstall
# patches the SAME hoisted `lexical` files; run in parallel they race on those
# writes and CI fails with "Patch context mismatch" (LOBE-13963). Only the
# handful of packages allowed below build, so serializing costs seconds.
childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@lobehub/editor': true
  '@vercel/speed-insights': true
  core-js: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  '@ant-design/icons': 6.3.2
  # Fork override: workspace packages declare @lobehub/ui as a wide `^5` peer, so pnpm
  # is free to keep an older copy alongside the root's. `$` forces every occurrence to
  # the root's own declared version and still tracks upstream bumps.
  '@lobehub/ui': $@lobehub/ui
  '@react-pdf/image': 3.0.4
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.0
  antd: 6.3.5
  baseline-browser-mapping: 2.10.31
  drizzle-orm: ^0.45.2
  fast-xml-parser: 5.4.2
  lexical: 0.42.0
  node-gyp: ^12.4.0
  pdfjs-dist: 5.4.530
  react: 19.2.7
  react-dom: 19.2.7
  's3rver>fast-xml-parser': 3.21.1
  stylelint-config-clean-order: 7.0.0
  typescript: 6.0.3
  vitest: 5.0.0
  'zod@^4': 4.5.4

patchedDependencies:
  '@upstash/qstash': patches/@upstash__qstash.patch
