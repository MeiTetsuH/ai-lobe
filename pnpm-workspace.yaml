# Fork override: upstream ships no lockfile, which lets warm build caches keep
# stale peer-satisfying versions and break Vercel builds. We commit one instead.
lockfile: true
resolutionMode: highest
dedupePeerDependents: true
ignoreWorkspaceRootCheck: true
enablePrePostScripts: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

packages:
  - packages/**
  - .
  - e2e
  - apps/desktop/src/main
  - apps/auth
  - apps/server
  - apps/share
  - apps/workbench

minimumReleaseAgeExclude:
  - '@auv-js/api-client@0.0.25'
  - '@auv-js/cli-darwin-arm64@0.0.25'
  - '@auv-js/cli-darwin-x64@0.0.25'
  - '@auv-js/cli-linux-arm64-gnu@0.0.25'
  - '@auv-js/cli-linux-x64-gnu@0.0.25'
  - '@auv-js/cli-win32-x64-msvc@0.0.25'
  - '@auv-js/cli@0.0.25'
  - '@auv-js/sdk@0.0.25'
  - '@lobehub/*'
  - virtua@0.53.5
  - baseline-browser-mapping@2.11.31

# Build scripts run one at a time. Several peer-variant copies of
# @lobehub/editor resolve in this workspace and every copy's postinstall
# patches the SAME hoisted `lexical` files; run in parallel they race on those
# writes and CI fails with "Patch context mismatch" (LOBE-13963). Only the
# handful of packages allowed below build, so serializing costs seconds.
childConcurrency: 1

allowBuilds:
  '@google/genai': true
  '@lobehub/editor': true
  '@sentry/cli': true
  '@vercel/speed-insights': true
  core-js: false
  electron-sparkle-updater: false
  es5-ext: false
  esbuild: false
  ffmpeg-static: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
  workerd: true

overrides:
  # Security fixes for compatible nested copies and workspace peers.
  next: 16.4.2
  sharp: 0.35.5
  better-auth: 1.6.33
  'form-data@<2.5.6': 2.5.6
  dompurify: 3.4.17
  proxy-addr: 2.0.8
  'protobufjs@>=8.0.0 <8.6.6': 8.8.1
  'qs@>=6 <6.16.0': 6.16.0
  '@opentelemetry/core@>=2 <2.8.0': 2.12.0
  '@apidevtools/json-schema-ref-parser@>=11 <11.1.1': 11.1.1
  'minimatch@>=9 <9.0.7': 9.0.7
  'ajv@>=8 <8.18.0': 8.18.0
  'yaml@>=2 <2.8.3': 2.8.3
  'js-yaml@>=4 <4.3.2': 4.3.2
  'undici@>=7 <7.29.1': 7.29.1
  'jsondiffpatch@<0.7.6': 0.7.6
  'adm-zip@<0.6.1': 0.6.1
  '@opentelemetry/propagator-jaeger@<2.9.0': 2.12.0
  # Keep workspace peers on the root UI version, including upstream major upgrades.
  '@lobehub/ui': $@lobehub/ui
  '@lobehub/icons': ^6.0.0
  '@lobehub/editor': ^5.0.0
  '@lobehub/charts': ^6.0.0
  '@lobehub/tts': ^6.0.0
  '@lobehub/fluent-emoji': ^5.0.0
  '@react-pdf/image': 3.0.4
  '@types/react': 19.2.13
  '@vitest/coverage-v8': 5.0.5
  baseline-browser-mapping: 2.11.31
  drizzle-orm: ^0.45.2
  fast-xml-parser: 5.11.2
  lexical: 0.42.0
  # Keep the coupled core/autolink patches applied without a root lockfile.
  micromark: 4.0.3
  micromark-extension-gfm-autolink-literal: 2.1.0
  node-gyp: ^12.4.0
  pdfjs-dist: 5.4.530
  react: 19.2.7
  react-dom: 19.2.7
  's3rver>fast-xml-parser': 3.21.1
  stylelint-config-clean-order: 7.0.0
  typescript: 6.0.3
  # 5.1 changes leading/trailing slash handling and breaks provider URL contracts.
  url-join: 5.0.0
  vitest: 5.0.5
  'zod@^4': 4.6.5

patchedDependencies:
  '@upstash/qstash': patches/@upstash__qstash.patch
  micromark@4.0.3: patches/micromark@4.0.3.patch
  micromark-extension-gfm-autolink-literal@2.1.0: patches/micromark-extension-gfm-autolink-literal@2.1.0.patch
