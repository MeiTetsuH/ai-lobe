packages:
  - '../cli'
  - '../../packages/agent-gateway-client'
  - '../../packages/agent-tracing'
  - '../../packages/chat-adapter-imessage'
  - '../../packages/heterogeneous-agents'
  - '../../packages/html-artifact'
  - '../../packages/const'
  - '../../packages/eval-rubric'
  - '../../packages/electron-server-ipc'
  - '../../packages/electron-client-ipc'
  - '../../packages/electron-mac-notifications'
  - '../../packages/electron-mac-permission-guide'
  - '../../packages/napi-loader'
  - '../../packages/file-loaders'
  - '../../packages/html-artifact'
  - '../../packages/desktop-bridge'
  - '../../packages/device-control'
  - '../../packages/device-sandbox'
  - '../../packages/device-gateway-client'
  - '../../packages/device-identity'
  - '../../packages/local-file-shell'
  - '../../packages/tool-runtime'
  - '../../packages/prompts'
  - '../../packages/ssrf-safe-fetch'
  - '../../packages/business/const'
  - '../../packages/types'
  - '../../packages/model-bank'
  - '../../packages/utils'
  - '.'

lockfile: true
shamefullyHoist: true
ignoreWorkspaceRootCheck: true

publicHoistPattern:
  - '*@umijs/lint*'
  - '*unicorn*'
  - '*changelog*'
  - '*commitlint*'
  - '*eslint*'
  - '*postcss*'
  - '*prettier*'
  - '*remark*'
  - '*semantic-release*'
  - '*stylelint*'
  - '@auth/core'
  - 'pdfjs-dist'

allowBuilds:
  '@sentry/cli': true
  electron: true
  electron-builder: true
  electron-sparkle-updater: false
  electron-winstaller: false
  esbuild: false
  get-windows: false
  node-mac-permissions: true
  protobufjs: false

overrides:
  # Keep each Undici major on the CVE-2026-109869 security patch.
  'undici@>=6 <6.29.1': 6.29.1
  'undici@>=7 <7.30.1': 7.30.1
  'undici@>=8 <8.12.2': 8.12.2
  # Its >=7 range originally resolved to 8.x; share the desktop dispatcher types.
  'fetch-socks>undici': 8.12.2
  '@grpc/grpc-js@>=1.14 <1.14.5': 1.14.5
  'http-cache-semantics@>=4 <4.3.0': 4.3.0
  'vite@>=8.3 <8.3.3': 8.3.3
  '@modelcontextprotocol/sdk@>=1 <1.32.0': 1.32.0
  'dompurify@>=3 <3.4.17': 3.4.17
  'ip-address@>=10 <10.7.4': 10.7.4
  'fast-uri@>=3 <3.1.9': 3.1.9
  'body-parser@>=2 <2.4.0': 2.4.0
  'electron@>=43 <43.8.1': 43.8.1
  'electron@>=44 <44.9.1': 44.9.1
  node-gyp: ^12.4.0
  react: 19.2.7
  react-dom: 19.2.7
  vitest: 5.0.3
  'zod@^4': 4.6.6
minimumReleaseAgeExclude:
  - '@auv-js/api-client@0.0.33'
  - '@auv-js/cli-darwin-arm64@0.0.33'
  - '@auv-js/cli-darwin-x64@0.0.33'
  - '@auv-js/cli-linux-arm64-gnu@0.0.33'
  - '@auv-js/cli-linux-x64-gnu@0.0.33'
  - '@auv-js/cli-win32-arm64-msvc@0.0.33'
  - '@auv-js/cli-win32-x64-msvc@0.0.33'
  - '@auv-js/cli@0.0.33'
  - '@auv-js/sdk@0.0.33'
  - electron-sparkle-updater@0.5.3
  - '@lobehub/*'
